  <script>
  function toggleFaq(item) {
    const isOpen = item.classList.contains('open');
    document.querySelectorAll('.faq-item').forEach(i => i.classList.remove('open'));
    if (!isOpen) item.classList.add('open');
  }
  </script>
   <div class="faq-item reveal" onclick="toggleFaq(this)">
          <div class="faq-question">
            What types of cancer does Sanjivani treat?
            <span class="faq-toggle"></span>
          </div>
          <div class="faq-answer">
            <div class="faq-answer-inner">We treat a wide range, including: Breast Cancer, GI Cancer, Gynecological Cancers, Head &amp; Neck Cancer, Hepatobiliary Cancer, and offer treatments like HIPEC/PIPEC, Advanced Laparoscopy, Endoscopy, and more.</div>
          </div>
          </div>
<style>
  .faq-item {
    border: 1px solid #ddd;
    border-radius: 5px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: background-color 0.3s ease;
    width: 400px;
    padding: 20px;
  }
  .faq-toggle {
    margin-left: 20px;
    outline: 1px solid rgb(37, 33, 9);
    padding: 5px;
    font-weight: bolder;
    border-radius: 5px;
  }
  .faq-answer {
    display: none;
  }
  .faq-item.open .faq-answer {
    display: block;
  }
  .faq-item.open .faq-toggle::before {
    content: "-";
  }
  .faq-toggle::before {
    content: "+";
  }
</style>
